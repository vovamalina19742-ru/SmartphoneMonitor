name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore "SmartphoneMonitor.csproj"

    - name: Build
      run: dotnet build "SmartphoneMonitor.csproj" --configuration Release --no-restore

    - name: Test
      run: dotnet test "Tests/SmartphoneMonitor.Tests.csproj" --configuration Release --no-build --verbosity normal
