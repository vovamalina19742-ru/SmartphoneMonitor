name: Grafana Dashboard CI

on:
  push:
    paths:
      - '.devops/grafana/dashboards/**'
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate dashboard JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard JSON with jq
        run: |
          echo 'Validating smartphone_monitor.json'
          jq -e . ./.devops/grafana/dashboards/smartphone_monitor.json

  deploy:
    name: Upload dashboard to Grafana (manual)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && secrets.GRAFANA_API_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - name: Upload dashboard
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: |
          set -e
          DASH=$(cat ./.devops/grafana/dashboards/smartphone_monitor.json)
          echo 'Uploading dashboard to Grafana at' $GRAFANA_URL
          curl -s -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $GRAFANA_API_KEY" \
            -d "{\"dashboard\": $DASH, \"overwrite\": true}" \
            "$GRAFANA_URL/api/dashboards/db" | jq
